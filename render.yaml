databases:
  - name: bookshelf-db
    plan: free
    databaseName: bookshelf
    user: bookshelf
    region: frankfurt

services:
  - type: web
    name: bookshelf-web
    runtime: docker
    region: frankfurt
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookshelf-db
          property: connectionString
      - key: NODE_ENV
        value: production
