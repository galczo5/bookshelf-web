databases:
  - name: bookshelf-db
    plan: free
    databaseName: bookshelf
    user: bookshelf
    region: frankfurt

services:
  - type: web
    name: bookshelf-web
    runtime: docker
    region: frankfurt
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookshelf-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BOOKSHELF_ALLOWED_EMAIL
        sync: false
      - key: AUTH_TOKENS_ENCRYPTION_KEY
        generateValue: true
