databases:
  - name: bookshelf-db
    plan: basic-256mb
    databaseName: bookshelf
    user: bookshelf
    region: frankfurt

services:
  - type: web
    name: bookshelf-web
    runtime: docker
    region: frankfurt
    plan: starter
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookshelf-db
          property: connectionString
      - key: NODE_ENV
        value: production

  - type: worker
    name: bookshelf-worker
    runtime: docker
    region: frankfurt
    plan: starter
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/worker.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookshelf-db
          property: connectionString
      - key: NODE_ENV
        value: production
